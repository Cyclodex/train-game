<!doctype html>
<meta charset="utf-8">
<title>renderbench — canvas 2d vs webgl, at scale</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 12px monospace; overflow: hidden; }
  #out { position: fixed; top: 6px; left: 6px; z-index: 10; background: #000b; padding: 5px 9px; white-space: pre; }
  canvas { display: block; }
</style>
<div id="out">…</div>
<canvas id="c" width="1600" height="1000"></canvas>
<script>
// RENDERBENCH — how big can a world get before each renderer gives up?
//
//   ?mode=canvas|webgl & cols=40 & rows=28 & sprites=200 & zoom=fit|near
//
// Both renderers draw the SAME scene the same honest way a real implementation
// would:
//   - the world is chunked (8x8 tiles) and only chunks INTERSECTING the camera
//     are drawn, because no sane renderer draws what is off screen;
//   - canvas bakes each chunk once into an offscreen bitmap and blits it, so a
//     static world costs one blit per visible chunk however detailed it is;
//   - webgl uploads the same chunk bitmaps as textures and draws them as quads,
//     then batches every sprite into ONE draw call.
//
// The point of the sweep: find which axis actually bites. World SIZE mostly
// costs memory (more cached chunks); what costs per FRAME is how much is on
// screen at once — visible tiles and, above all, visible moving sprites.
const q = new URLSearchParams(location.search);
const MODE = q.get("mode") || "canvas";
const COLS = +(q.get("cols") || 40);
const ROWS = +(q.get("rows") || 28);
const SPRITES = +(q.get("sprites") || 200);
const ZOOM = q.get("zoom") || "fit";
const TILE = 200, CHUNK = 8;
const cv = document.getElementById("c");
const W = cv.width, H = cv.height;
const worldW = COLS * TILE, worldH = ROWS * TILE;
// "fit" shows the whole world (what a player does on a big board); "near" is a
// playing zoom of about 12 tiles across.
const scale = ZOOM === "fit" ? Math.min(W / worldW, H / worldH) : W / (12 * TILE);

// --- shared scene ------------------------------------------------------------
const isRoad = (x, y) => x % 6 === 1 || y % 7 === 2;
const LOD = q.get("lod") === "1";
// Screen pixels one chunk occupies at the current zoom. Baking finer than this
// is invisible work and wasted memory; this is the map-tile idea (a zoom level
// has its own resolution) applied to a game world.
const chunkScreenPx = Math.max(16, Math.min(CHUNK * TILE, Math.ceil(CHUNK * TILE * scale)));
const BAKE_PX = LOD ? chunkScreenPx : CHUNK * TILE;
// Sprites stop being drawn as bodies once a body is a couple of pixels: below
// that they become dots, which is what "less detail when zoomed out" means in
// practice. Off entirely (dotless) is the map/fog mode.
const SPRITE_PX = 38 * scale;
const SPRITE_LOD = LOD && SPRITE_PX < 3;
function bakeChunk(cx, cy) {
  const px = BAKE_PX;
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  g.scale(px / (CHUNK * TILE), px / (CHUNK * TILE));
  for (let ty = 0; ty < CHUNK; ty++) {
    for (let tx = 0; tx < CHUNK; tx++) {
      const wx = cx * CHUNK + tx, wy = cy * CHUNK + ty;
      if (wx >= COLS || wy >= ROWS) continue;
      const ox = tx * TILE, oy = ty * TILE;
      g.fillStyle = (wx + wy) % 2 ? "#3f7a3a" : "#437f3d";
      g.fillRect(ox, oy, TILE, TILE);
      for (let i = 0; i < 26; i++) {
        g.fillStyle = i % 2 ? "#4c8a46" : "#376b33";
        g.beginPath();
        g.arc(ox + ((i * 37) % TILE), oy + ((i * 71) % TILE), 5 + (i % 4), 0, 6.28);
        g.fill();
      }
      if (isRoad(wx, wy)) {
        g.fillStyle = "#8a8d92";
        g.fillRect(ox, oy + TILE * 0.36, TILE, TILE * 0.28);
        g.fillStyle = "#e8e2c0";
        for (let x = 0; x < TILE; x += 40) g.fillRect(ox + x, oy + TILE * 0.49, 22, 4);
      }
    }
  }
  return c;
}
const chunksX = Math.ceil(COLS / CHUNK), chunksY = Math.ceil(ROWS / CHUNK);
const chunkCache = new Map();
const CACHE_MAX = +(q.get("cache") || 400); // LRU — a world may be huge, memory may not
const getChunk = (cx, cy) => {
  const k = cx + "," + cy;
  let c = chunkCache.get(k);
  if (c) { chunkCache.delete(k); chunkCache.set(k, c); return c; }
  c = bakeChunk(cx, cy);
  chunkCache.set(k, c);
  if (chunkCache.size > CACHE_MAX) chunkCache.delete(chunkCache.keys().next().value);
  return c;
};

const sprites = Array.from({ length: SPRITES }, (_, i) => ({
  x: Math.random() * worldW, y: Math.random() * worldH,
  a: Math.random() * 6.28, v: 60 + Math.random() * 80,
  w: 38, h: 20, tint: [0.4 + Math.random() * 0.6, 0.4 + Math.random() * 0.5, 0.5 + Math.random() * 0.5],
}));
// Camera: fit shows everything; near pans slowly so the culling is exercised.
let camX = worldW / 2, camY = worldH / 2;
function stepScene(dt) {
  for (const s of sprites) {
    s.x += Math.cos(s.a) * s.v * dt;
    s.y += Math.sin(s.a) * s.v * dt;
    if (s.x < 0 || s.x > worldW || s.y < 0 || s.y > worldH) s.a += 3.14159;
  }
  if (ZOOM === "near") {
    camX += 120 * dt; if (camX > worldW) camX = 0;
  }
}
const viewLeft = () => camX - W / 2 / scale, viewTop = () => camY - H / 2 / scale;
const viewRight = () => camX + W / 2 / scale, viewBottom = () => camY + H / 2 / scale;

// --- canvas 2d ---------------------------------------------------------------
function canvasRenderer() {
  const g = cv.getContext("2d", { alpha: false });
  return function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = "#223";
    g.fillRect(0, 0, W, H);
    g.setTransform(scale, 0, 0, scale, -viewLeft() * scale, -viewTop() * scale);
    let drawn = 0;
    const cx0 = Math.max(0, Math.floor(viewLeft() / (CHUNK * TILE)));
    const cx1 = Math.min(chunksX - 1, Math.floor(viewRight() / (CHUNK * TILE)));
    const cy0 = Math.max(0, Math.floor(viewTop() / (CHUNK * TILE)));
    const cy1 = Math.min(chunksY - 1, Math.floor(viewBottom() / (CHUNK * TILE)));
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        g.drawImage(getChunk(cx, cy), cx * CHUNK * TILE, cy * CHUNK * TILE, CHUNK * TILE, CHUNK * TILE);
        drawn++;
      }
    }
    let vis = 0;
    for (const s of sprites) {
      if (s.x < viewLeft() || s.x > viewRight() || s.y < viewTop() || s.y > viewBottom()) continue;
      vis++;
      if (SPRITE_LOD) {
        g.fillStyle = `rgb(${s.tint.map(v => (v * 255) | 0).join(",")})`;
        g.fillRect(s.x - 2 / scale, s.y - 2 / scale, 4 / scale, 4 / scale);
        continue;
      }
      g.save();
      g.translate(s.x, s.y);
      g.rotate(s.a);
      g.fillStyle = `rgb(${s.tint.map(v => (v * 255) | 0).join(",")})`;
      g.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      g.fillStyle = "#bcd7e8";
      g.fillRect(-s.w * 0.12, -s.h / 2 + 2, s.w * 0.3, s.h - 4);
      g.restore();
    }
    return { chunks: drawn, visible: vis };
  };
}

// --- webgl -------------------------------------------------------------------
// A minimal sprite batcher: chunk bitmaps as textures, and EVERY sprite in one
// buffer + one draw call. This is what PixiJS does for you; written out here so
// the comparison needs no dependency.
function webglRenderer() {
  const gl = cv.getContext("webgl2", { alpha: false, antialias: false });
  if (!gl) throw new Error("no webgl2");
  const vs = `#version 300 es
  in vec2 aPos; in vec2 aUV; in vec4 aTint;
  uniform vec2 uView; uniform vec2 uScaleOff;
  out vec2 vUV; out vec4 vTint;
  void main() {
    vec2 p = (aPos - uScaleOff) * uView;
    gl_Position = vec4(p.x - 1.0, 1.0 - p.y, 0.0, 1.0);
    vUV = aUV; vTint = aTint;
  }`;
  const fs = `#version 300 es
  precision mediump float;
  in vec2 vUV; in vec4 vTint; uniform sampler2D uTex; uniform float uUseTex;
  out vec4 outColor;
  void main() {
    vec4 t = texture(uTex, vUV);
    outColor = mix(vTint, t, uUseTex);
  }`;
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const loc = n => gl.getUniformLocation(prog, n);
  const buf = gl.createBuffer();
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const STRIDE = 8 * 4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, STRIDE, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, STRIDE, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, STRIDE, 16);
  const texCache = new Map();
  const chunkTex = (cx, cy) => {
    const k = cx + "," + cy;
    let t = texCache.get(k);
    if (!t) {
      t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, getChunk(cx, cy));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      texCache.set(k, t);
    }
    return t;
  };
  let arr = new Float32Array(6 * 8 * 4096);
  const push = (o, x0, y0, x1, y1, x2, y2, x3, y3, tint) => {
    const quad = [[x0, y0, 0, 0], [x1, y1, 1, 0], [x2, y2, 1, 1], [x0, y0, 0, 0], [x2, y2, 1, 1], [x3, y3, 0, 1]];
    for (const [x, y, u, v] of quad) {
      arr[o++] = x; arr[o++] = y; arr[o++] = u; arr[o++] = v;
      arr[o++] = tint[0]; arr[o++] = tint[1]; arr[o++] = tint[2]; arr[o++] = 1;
    }
    return o;
  };
  gl.viewport(0, 0, W, H);
  return function draw() {
    gl.clearColor(0.13, 0.13, 0.2, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(loc("uView"), (2 * scale) / W, (2 * scale) / H);
    gl.uniform2f(loc("uScaleOff"), viewLeft(), viewTop());
    // chunks — one draw call each (they carry different textures)
    gl.uniform1f(loc("uUseTex"), 1);
    const cx0 = Math.max(0, Math.floor(viewLeft() / (CHUNK * TILE)));
    const cx1 = Math.min(chunksX - 1, Math.floor(viewRight() / (CHUNK * TILE)));
    const cy0 = Math.max(0, Math.floor(viewTop() / (CHUNK * TILE)));
    const cy1 = Math.min(chunksY - 1, Math.floor(viewBottom() / (CHUNK * TILE)));
    let chunks = 0;
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const X = cx * CHUNK * TILE, Y = cy * CHUNK * TILE, S = CHUNK * TILE;
        const n = push(0, X, Y, X + S, Y, X + S, Y + S, X, Y + S, [1, 1, 1]);
        gl.bindTexture(gl.TEXTURE_2D, chunkTex(cx, cy));
        gl.bufferData(gl.ARRAY_BUFFER, arr.subarray(0, n), gl.STREAM_DRAW);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        chunks++;
      }
    }
    // sprites — ALL of them in one buffer, one draw call
    gl.uniform1f(loc("uUseTex"), 0);
    let o = 0, vis = 0;
    const need = sprites.length * 6 * 8;
    if (arr.length < need) arr = new Float32Array(need);
    for (const s of sprites) {
      if (s.x < viewLeft() || s.x > viewRight() || s.y < viewTop() || s.y > viewBottom()) continue;
      vis++;
      const c = Math.cos(s.a), si = Math.sin(s.a), hw = s.w / 2, hh = s.h / 2;
      const rx = (dx, dy) => s.x + dx * c - dy * si;
      const ry = (dx, dy) => s.y + dx * si + dy * c;
      o = push(o, rx(-hw, -hh), ry(-hw, -hh), rx(hw, -hh), ry(hw, -hh),
        rx(hw, hh), ry(hw, hh), rx(-hw, hh), ry(-hw, hh), s.tint);
    }
    if (o > 0) {
      gl.bufferData(gl.ARRAY_BUFFER, arr.subarray(0, o), gl.STREAM_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, o / 8);
    }
    return { chunks, visible: vis };
  };
}

const draw = MODE === "webgl" ? webglRenderer() : canvasRenderer();
let last = 0, info = { chunks: 0, visible: 0 };
const cb = [], ts = [];
function frame(now) {
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
  last = now;
  const t0 = performance.now();
  stepScene(dt);
  info = draw();
  cb.push(performance.now() - t0);
  ts.push(now);
  if (cb.length > 3000) { cb.splice(0, 1500); ts.splice(0, 1500); }
  window.__bench = { cb, ts, info, mode: MODE, cols: COLS, rows: ROWS, sprites: SPRITES, zoom: ZOOM };
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => {
  const b = window.__bench;
  if (!b || b.ts.length < 10) return;
  const span = b.ts[b.ts.length - 1] - b.ts[0];
  const fps = ((b.ts.length - 1) / span) * 1000;
  const mean = b.cb.reduce((a, c) => a + c, 0) / b.cb.length;
  document.getElementById("out").textContent =
    `${MODE}  ${COLS}x${ROWS} tiles  ${SPRITES} sprites  zoom=${ZOOM}\n` +
    `${fps.toFixed(1)} fps · draw ${mean.toFixed(2)} ms · ` +
    `${b.info.chunks} chunks, ${b.info.visible} sprites visible`;
}, 500);
</script>
