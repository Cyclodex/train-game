name: Status labels → project board

# Mirrors issue state onto the project board's Status column, so cards move
# automatically when e.g. the implement workflow advances an issue to
# in-progress / in-review, or a merged PR closes its issue. Labels (and the
# open/closed state) are the source of truth.
#
# Handles:
# - issues.labeled    → column matching the new `status: *` label
# - issues.closed     → Done  (covers boards where the built-in
#                       "Item closed → Done" project workflow isn't enabled)
# - issues.reopened   → column matching the issue's current `status: *` label
# - workflow_dispatch → re-sync a single issue by number (repair tool: run it
#                       from the Actions tab when a card is out of sync)
#
# Requires the same PROJECT_NUMBER variable and PROJECT_SYNC_TOKEN secret
# as project-handover.yml, and board Status options named exactly:
# Triage, Ready for dev, In progress, In review, Done.

on:
  issues:
    types: [labeled, closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to re-sync onto the board"
        required: true

jobs:
  sync:
    if: >-
      vars.PROJECT_NUMBER != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.action != 'labeled' ||
       startsWith(github.event.label.name, 'status: '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            const labelToStatus = {
              'status: triage': 'Triage',
              'status: ready-for-dev': 'Ready for dev',
              'status: in-progress': 'In progress',
              'status: in-review': 'In review',
            };
            const statusFromLabels = (labels) => {
              const name = labels
                .map((l) => (typeof l === 'string' ? l : l.name))
                .find((n) => labelToStatus[n]);
              return name ? labelToStatus[name] : undefined;
            };

            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);
            const { owner, repo } = context.repo;

            let issueNumber;
            let desired;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: issueNumber,
              });
              if (issue.pull_request) {
                return core.warning(`#${issueNumber} is a pull request — only issue cards are synced`);
              }
              desired = issue.state === 'closed' ? 'Done' : statusFromLabels(issue.labels);
            } else if (context.payload.action === 'closed') {
              issueNumber = context.payload.issue.number;
              desired = 'Done';
            } else if (context.payload.action === 'reopened') {
              issueNumber = context.payload.issue.number;
              desired = statusFromLabels(context.payload.issue.labels) ?? 'Triage';
            } else {
              issueNumber = context.payload.issue.number;
              desired = labelToStatus[context.payload.label.name];
            }
            if (!desired) return core.info(`No status mapping for issue #${issueNumber}`);

            const res = await github.graphql(`
              query ($owner: String!, $repo: String!, $issue: Int!, $project: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    projectItems(first: 10) {
                      nodes { id project { id number } }
                    }
                  }
                }
                user(login: $owner) {
                  projectV2(number: $project) {
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }`, { owner, repo, issue: issueNumber, project: projectNumber });

            const item = res.repository.issue.projectItems.nodes
              .find((n) => n.project.number === projectNumber);
            if (!item) return core.info(`Issue #${issueNumber} is not on project ${projectNumber}`);

            const field = res.user.projectV2.field;
            const option = field.options.find((o) => o.name === desired);
            if (!option) return core.warning(`Board has no Status option named "${desired}"`);

            await github.graphql(`
              mutation ($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }`, { project: item.project.id, item: item.id, field: field.id, option: option.id });
            core.info(`Issue #${issueNumber} board status → ${desired}`);
