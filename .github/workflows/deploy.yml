name: Deploy

# GitHub Pages deployment, two flavours in one workflow:
#   - push to master  -> build + deploy to the gh-pages branch root
#                        -> https://cyclodex.github.io/train-game/
#   - pull requests   -> build + deploy to gh-pages/pr-preview/pr-<N>/
#                        -> https://cyclodex.github.io/train-game/pr-preview/pr-<N>/
#                        (the action comments the link on the PR and removes the
#                        preview again when the PR closes; a follow-up step
#                        rewrites any localhost links in the PR body to that
#                        preview, so a reviewer can click them)
#
# Both jobs push commits to the same gh-pages branch, so they share one
# concurrency group to avoid racing pushes. The master deploy cleans everything
# EXCEPT pr-preview/, so previews survive master deploys and vice versa.
#
# One-time setup: repo Settings -> Pages -> Source "Deploy from a branch",
# branch "gh-pages", folder "/ (root)". The branch is created by the first run.
#
# The Vite build uses base "./" (relative asset paths, see vite.config.ts), so
# the identical build output works at both URL depths.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-master:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  deploy-pr-preview:
    # Fork PRs get a read-only token and cannot push to gh-pages; skip them.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist

      # Every task hands back links to the pages it touched (CLAUDE.md), and they
      # are written against the dev server because that is where the author was
      # looking. A reviewer has no dev server — so once the preview for THIS PR
      # is live, rewrite those links to point at it. The author keeps writing
      # localhost; the reader gets a URL that opens.
      #
      # Only the body: comments are a conversation with a timestamp, and editing
      # someone's words after the fact reads worse than a stale link.
      - name: Point localhost links at this PR's preview
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // github.io hosts are lower-case; the repo owner is not necessarily.
            const base =
              `https://${owner.toLowerCase()}.github.io/${repo}/pr-preview/pr-${context.issue.number}/`;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            const body = pr.body ?? "";
            // The trailing slash is eaten by the match and given back by `base`,
            // so `…:5173/#/play` becomes `…/pr-<N>/#/play` rather than growing a
            // second slash — and a bare `…:5173` still lands on the preview root.
            // Idempotent either way: a rewritten URL has no localhost left in it.
            const rewritten = body.replace(
              /https?:\/\/(?:localhost|127\.0\.0\.1):\d+\/?/g,
              base
            );
            if (rewritten === body) {
              core.info("No dev-server links in the body; nothing to rewrite.");
              return;
            }
            await github.rest.pulls.update({
              owner, repo, pull_number: context.issue.number, body: rewritten,
            });
            core.info(`Rewrote dev-server links to ${base}`);
