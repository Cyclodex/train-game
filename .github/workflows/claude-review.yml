name: Claude PR Review

# First-pass review on every PR (stage 4 of docs/TICKET_WORKFLOW.md).
# The human reviewer still approves and merges; sign-off stays manual.

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs from the implement pipeline are authored by claude[bot]; the
          # action refuses bot-initiated runs unless the bot is allowed
          # ("Workflow initiated by non-human actor: claude").
          allowed_bots: "claude"
          prompt: |
            Review PR #${{ github.event.pull_request.number }}.

            - Check the diff against the acceptance criteria of the issue
              referenced in the PR description ("Refs #N").
            - Look for correctness bugs, broken train/traffic-light behaviour,
              and deviations from the existing code style.
            - For a VISUAL change, confirm the PR's "Before / After" section has a
              before/after screenshot pair (under docs/verify/issue-<N>/) that
              actually shows the acceptance criteria met. Flag it if the pair is
              missing, doesn't match the scenario, or the "after" still shows the
              bug. Don't re-capture — the implementer provides the proof
              (docs/TICKET_WORKFLOW.md → "Visual verification").
            - Post your findings as inline review comments. Be concise; skip
              nitpicks that prettier/eslint already cover.
