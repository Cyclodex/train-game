name: Claude Implement (handover)

# Stage 3+4 of docs/TICKET_WORKFLOW.md:
# adding the "status: ready-for-dev" label to an issue hands it to Claude,
# which implements it and opens a PR for review.

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: "github.event.label.name == 'status: ready-for-dev'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Model is chosen during triage via an optional label:
      # "model: opus" for complex tickets, "model: haiku" for trivial ones,
      # no label (or "model: sonnet") = Sonnet, the default.
      - id: model
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *",model: opus,"*)  echo "model=claude-opus-4-8" >> "$GITHUB_OUTPUT" ;;
            *",model: haiku,"*) echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: anthropics/claude-code-action@v1
        env:
          # Lets Claude run `gh pr create` / `gh issue edit` for steps 2/5/6.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Implement issue #${{ github.event.issue.number }} following the process
            in docs/TICKET_WORKFLOW.md.

            1. Read the issue (title, body, acceptance criteria) and the referenced
               code locations.
            2. Replace the issue label "status: ready-for-dev" with "status: in-progress"
               (use `gh issue edit`).
            3. Implement the change on a branch named <type>/<issue-number>-<short-name>
               (e.g. fix/3-correct-signal).
            4. Run `npm run lint` and `npm run test:unit` and fix any failures.
            5. Open a pull request with `gh pr create`, following the PR template.
               Reference the issue with "Closes #${{ github.event.issue.number }}"
               so merging the PR closes it automatically.
            6. Replace the issue label "status: in-progress" with "status: in-review"
               (use `gh issue edit`).
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(npm install),Bash(npm ci),Bash(npm run lint),Bash(npm run lint:*),Bash(npm run test:unit),Bash(git:*),Bash(gh pr create:*),Bash(gh issue edit:*)"
